
name: Build and deploy Geopolitics Game frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/geopolitics-game-ionic/package-lock.json

      - name: Install dependencies
        working-directory: frontend/geopolitics-game-ionic
        run: npm ci

      - name: Build Ionic Angular application
        working-directory: frontend/geopolitics-game-ionic
        run: npm run build -- --configuration production

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: geopolitics-game-web
          path: frontend/geopolitics-game-ionic/www/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: geopolitics-game-web
          path: ./www

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8829BEEA8D194AD6801F67E64BD0357C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEF9904E18C34779816DECB61B61A3A3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CAB248E2B7094567939DA08332C771DE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: geopolitics-game-web
          slot-name: Production
          package: ./www
