
<ion-content class="forgot-content">

  <div class="forgot-container">

    <div class="forgot-card">

      <div class="logo">
        <span class="logo-icon">G</span>
        <span>GEOPOLITICS</span>
      </div>

      <div class="forgot-icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <h1>Forgot Password?</h1>

      <p class="description">
        Don't worry. Enter your registered email address and
        we'll send you instructions to reset your password.
      </p>

      <!-- Forgot Password Form -->
      <form (ngSubmit)="submitRequest()" *ngIf="!submitted()">

        <ion-item class="input-item" lines="none">
          <ion-label position="stacked">Email Address</ion-label>

          <ion-input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email address"
            required>
          </ion-input>
        </ion-item>

        <p class="error-message" *ngIf="errorMessage()">
          {{ errorMessage() }}
        </p>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="isLoading()">

          <ion-spinner
            *ngIf="isLoading()"
            name="crescent">
          </ion-spinner>

          <span *ngIf="!isLoading()">Send Reset Link</span>

        </ion-button>

      </form>

      <!-- Successful Request -->
      <div class="success-message" *ngIf="submitted()">

        <ion-icon name="checkmark-circle-outline"></ion-icon>

        <h2>Check Your Email</h2>

        <p>{{ message() }}</p>

        <ion-button expand="block" (click)="goToLogin()">
          Return to Login
        </ion-button>

      </div>

      <!-- Back to Login -->
      <div class="back-link" *ngIf="!submitted()">
        <a (click)="goToLogin()">← Back to Login</a>
      </div>

    </div>

  </div>

</ion-content>
